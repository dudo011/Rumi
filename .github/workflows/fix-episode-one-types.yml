name: Fix episode one types

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-episode-one-types.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix analyzer issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/adventure/flame/episode_1_flame_screen.dart')
          s = p.read_text()
          s = s.replace("import 'dart:ui';\n", '')
          s = s.replace('final cardWidth = math.min(size.x * 0.78, 620);', 'final cardWidth = math.min(size.x * 0.78, 620).toDouble();')
          s = s.replace('width: math.min(size.x * 0.86, 720), height: math.min(size.y * 0.7, 560)', 'width: math.min(size.x * 0.86, 720).toDouble(), height: math.min(size.y * 0.7, 560).toDouble()')
          p.write_text(s)
          PY
      - name: Commit fixes and remove workflow
        run: |
          rm .github/workflows/fix-episode-one-types.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resolve episode one analyzer types'
          git push
