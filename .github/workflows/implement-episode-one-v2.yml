name: Integrate Episode 1 redesign
# Compatibility and analyzer cleanup rerun

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-episode-one-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply approved Episode 1 integration
        run: python tool/implement_episode_one_v2.py

      - name: Format and validate
        shell: bash
        run: |
          set +e

          flutter pub get > /tmp/pub-get.log 2>&1
          PUB_RESULT=$?

          dart format \
            lib/features/adventure/escape/episode_one_v2 \
            lib/features/home/home_screen.dart \
            test/episode_one_redesign_test.dart \
            > /tmp/format.log 2>&1
          FORMAT_RESULT=$?

          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_RESULT=$?

          flutter test > /tmp/test.log 2>&1
          TEST_RESULT=$?

          flutter build web --release --base-href /Rumi/ --pwa-strategy=none \
            > /tmp/build.log 2>&1
          BUILD_RESULT=$?

          status_text() {
            if [ "$1" -eq 0 ]; then
              echo "성공"
            else
              echo "실패"
            fi
          }

          ALL_SUCCESS=0
          if [ "$PUB_RESULT" -eq 0 ] && \
             [ "$FORMAT_RESULT" -eq 0 ] && \
             [ "$ANALYZE_RESULT" -eq 0 ] && \
             [ "$TEST_RESULT" -eq 0 ] && \
             [ "$BUILD_RESULT" -eq 0 ]; then
            ALL_SUCCESS=1
          fi

          {
            echo "# Episode 1 학습 확장 개편 검증 결과"
            echo
            echo "- 검증일: $(date -u +%Y-%m-%d)"
            echo "- 검증 기준 커밋: $(git rev-parse HEAD)"
            echo "- flutter pub get: $(status_text "$PUB_RESULT")"
            echo "- dart format: $(status_text "$FORMAT_RESULT")"
            echo "- flutter analyze: $(status_text "$ANALYZE_RESULT")"
            echo "- flutter test: $(status_text "$TEST_RESULT")"
            echo "- flutter build web: $(status_text "$BUILD_RESULT")"
            echo
            if [ "$ALL_SUCCESS" -eq 1 ]; then
              echo "## 최종 판정"
              echo
              echo "Episode 1 필수 학습 활동 14개, 단서 6개, 조건부 보강·도전 활동, 설치형 앱 안전영역과 Home 직접 진입이 전체 검증을 통과했다."
            else
              echo "## 최종 판정"
              echo
              echo "실패 항목이 있어 추가 수정과 재검증이 필요하다."
              echo
              if [ "$ANALYZE_RESULT" -ne 0 ]; then
                echo "## analyze 오류"
                echo '```text'
                tail -n 180 /tmp/analyze.log
                echo '```'
                echo
              fi
              if [ "$TEST_RESULT" -ne 0 ]; then
                echo "## test 오류"
                echo '```text'
                tail -n 240 /tmp/test.log
                echo '```'
                echo
              fi
              if [ "$BUILD_RESULT" -ne 0 ]; then
                echo "## build 오류"
                echo '```text'
                tail -n 160 /tmp/build.log
                echo '```'
              fi
            fi
          } > docs/EPISODE_01_REDESIGN_VALIDATION.md

          echo "$ALL_SUCCESS" > /tmp/all-success

      - name: Commit integration and validation result
        shell: bash
        run: |
          if [ "$(cat /tmp/all-success)" = "1" ]; then
            rm .github/workflows/implement-episode-one-v2.yml
            rm tool/implement_episode_one_v2.py
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate redesigned episode one learning flow'
          git push origin HEAD:main

      - name: Fail when validation failed
        shell: bash
        run: |
          if [ "$(cat /tmp/all-success)" != "1" ]; then
            exit 1
          fi
