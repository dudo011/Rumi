name: Update Episode 1 completion documents

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update completion documents
        run: python tool/update_episode_one_completion_docs.py

      - name: Commit completion documents
        shell: bash
        run: |
          rm .github/workflows/update-episode-one-completion-docs.yml
          rm tool/update_episode_one_completion_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize episode one completion and playtest guide'
          git push origin HEAD:main
