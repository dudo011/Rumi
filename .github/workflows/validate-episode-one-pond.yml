name: Validate Episode 1 pond

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-episode-one-pond.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and validate
        shell: bash
        run: |
          set +e
          dart format \
            lib/features/adventure/escape/episode_one/episode_one_puzzles.dart \
            lib/features/adventure/escape/episode_one/episode_one_state.dart \
            lib/features/adventure/escape/episode_one/episode_one_scene.dart \
            lib/features/adventure/escape/episode_one/episode_one_escape_screen.dart \
            lib/features/adventure/escape/episode_one/widgets/episode_one_inventory_overlay.dart \
            lib/features/adventure/garden_exploration_screen.dart \
            test/episode_one_escape_foundation_test.dart
          FORMAT_RESULT=$?
          flutter pub get > /tmp/pub-get.log 2>&1
          PUB_RESULT=$?
          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_RESULT=$?
          flutter test > /tmp/test.log 2>&1
          TEST_RESULT=$?
          flutter build web --release --base-href /Rumi/ --pwa-strategy=none > /tmp/build.log 2>&1
          BUILD_RESULT=$?

          status_text() {
            if [ "$1" -eq 0 ]; then
              echo "성공"
            else
              echo "실패"
            fi
          }

          {
            echo '# Episode 1 구현 3단계 자동 검증 결과'
            echo
            echo "- 검증 기준 커밋: $(git rev-parse HEAD)"
            echo "- dart format: $(status_text "$FORMAT_RESULT")"
            echo "- flutter pub get: $(status_text "$PUB_RESULT")"
            echo "- flutter analyze: $(status_text "$ANALYZE_RESULT")"
            echo "- flutter test: $(status_text "$TEST_RESULT")"
            echo "- flutter build web: $(status_text "$BUILD_RESULT")"
            echo
            if [ "$ANALYZE_RESULT" -ne 0 ]; then
              echo '## Analyze 오류'
              echo '```text'
              tail -n 100 /tmp/analyze.log
              echo '```'
              echo
            fi
            if [ "$TEST_RESULT" -ne 0 ]; then
              echo '## Test 오류'
              echo '```text'
              tail -n 140 /tmp/test.log
              echo '```'
              echo
            fi
            if [ "$BUILD_RESULT" -ne 0 ]; then
              echo '## Build 오류'
              echo '```text'
              tail -n 100 /tmp/build.log
              echo '```'
            fi
          } > docs/EPISODE_01_POND_VALIDATION.md

          if [ "$FORMAT_RESULT" -ne 0 ] || [ "$PUB_RESULT" -ne 0 ] || [ "$ANALYZE_RESULT" -ne 0 ] || [ "$TEST_RESULT" -ne 0 ] || [ "$BUILD_RESULT" -ne 0 ]; then
            exit 1
          fi

      - name: Update project context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('PROJECT_CONTEXT.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 21. Episode 1 구현 3단계 완료 (2026-07-28)'
          if heading not in text:
              text = text.rstrip() + '''

## 21. Episode 1 구현 3단계 완료 (2026-07-28)

### 구현 완료 범위

- 검증된 P0·P1 상태로 복구하고 중단된 일괄 구현 파일 제거
- 반짝이는 연못 정식 장면과 별 모양 돌거울
- 인벤토리 4칸과 별무늬 렌즈 선택·해제 표시
- 잘못된 상태에서 돌거울을 누르면 아이템을 소모하지 않는 안내
- 별무늬 렌즈 설치 애니메이션과 기억거울 확대 전환
- P3 실제 발자국 `0 → 2 → 4 → 6` 순서 추적
- 바람 자국과 순서가 다른 발자국의 무벌점 피드백
- 해결 후 `바람 뒤의 젖은 발자국` 핵심 단서 기록
- 단서 수첩 버튼과 연못 단서 확인 화면
- 360×640 작은 화면의 HUD·인벤토리 대응

### 자동 검증

- `dart format`: 성공
- `flutter pub get`: 성공
- `flutter analyze`: 성공
- `flutter test`: 성공
- `flutter build web --release --base-href /Rumi/ --pwa-strategy=none`: 성공

### 확인 방법

```text
오늘의 모험
→ 우측 개발 메뉴
→ 새 방탈출 P0·P1·P3 체험
→ P0·P1 해결
→ 인벤토리에서 별무늬 렌즈 선택
→ 반짝이는 연못의 별거울에 사용
→ 둥근 발자국 네 개를 물가부터 순서대로 선택
→ 단서 수첩에서 젖은 발자국 기록 확인
```

### 다음 작업

1. 시계꽃 숲 정식 장면과 P2 시간고리 구현
2. 4칸·6칸 반복의 첫 공통 위치 12 선택
3. 은빛 바람끈 획득과 인벤토리 연결
4. 연못과 시계꽃 숲을 자유 순서로 해결하는 회귀 테스트
'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit validated result
        shell: bash
        run: |
          rm .github/workflows/validate-episode-one-pond.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize episode one pond and inventory'
          git push origin HEAD:main
