name: Fix and revalidate Episode 1 finale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-episode-one-final-validation.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply finale transition fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          screen = Path('lib/features/adventure/escape/episode_one/episode_one_escape_screen.dart')
          replace_once(
              screen,
              '  late final bool _ownsController;\n',
              '  late final bool _ownsController;\n  bool _finaleStarted = false;\n',
          )
          replace_once(
              screen,
              '              child: EpisodeOneGreenhouseOverlay(controller: _controller),\n',
              '''              child: EpisodeOneGreenhouseOverlay(
                controller: _controller,
                onStartFinale: () {
                  if (!_finaleStarted) {
                    setState(() => _finaleStarted = true);
                  }
                },
              ),
''',
          )
          replace_once(
              screen,
              '''            Positioned.fill(
              child: EpisodeOneFinaleOverlay(
                controller: _controller,
                store: widget.store,
                onReturnToGarden: _returnToHome,
              ),
            ),
''',
              '''            if (_finaleStarted)
              Positioned.fill(
                child: EpisodeOneFinaleOverlay(
                  controller: _controller,
                  store: widget.store,
                  onReturnToGarden: _returnToHome,
                ),
              ),
''',
          )

          greenhouse = Path('lib/features/adventure/escape/episode_one/widgets/episode_one_greenhouse_overlay.dart')
          replace_once(
              greenhouse,
              '''  const EpisodeOneGreenhouseOverlay({required this.controller, super.key});

  final EpisodeOneStateController controller;
''',
              '''  const EpisodeOneGreenhouseOverlay({
    required this.controller,
    required this.onStartFinale,
    super.key,
  });

  final EpisodeOneStateController controller;
  final VoidCallback onStartFinale;
''',
          )
          replace_once(
              greenhouse,
              '''                      ? _GreenhouseInterior(
                          snapshot: snapshot,
                          controller: controller,
                        )
''',
              '''                      ? _GreenhouseInterior(
                          snapshot: snapshot,
                          controller: controller,
                          onStartFinale: onStartFinale,
                        )
''',
          )
          replace_once(
              greenhouse,
              '''class _GreenhouseInterior extends StatelessWidget {
  const _GreenhouseInterior({required this.snapshot, required this.controller});

  final EpisodeOneSnapshot snapshot;
  final EpisodeOneStateController controller;
''',
              '''class _GreenhouseInterior extends StatelessWidget {
  const _GreenhouseInterior({
    required this.snapshot,
    required this.controller,
    required this.onStartFinale,
  });

  final EpisodeOneSnapshot snapshot;
  final EpisodeOneStateController controller;
  final VoidCallback onStartFinale;
''',
          )
          replace_once(
              greenhouse,
              '''        const SizedBox(height: 12),
        SizedBox(
          width: double.infinity,
          child: OutlinedButton.icon(
            key: const Key('episode-one-greenhouse-interior-return'),
            onPressed: snapshot.inputLocked ? null : controller.returnToGarden,
            icon: const Icon(Icons.park_rounded),
            label: const Text('중앙 정원으로 돌아가기'),
          ),
        ),
''',
              '''        const SizedBox(height: 12),
        if (snapshot.seedFound) ...[
          SizedBox(
            width: double.infinity,
            child: FilledButton.icon(
              key: const Key('episode-one-start-final-deduction'),
              onPressed: snapshot.inputLocked ? null : onStartFinale,
              icon: const Icon(Icons.psychology_alt_rounded),
              label: const Text(
                '세 증거를 연결해 사건 해결하기',
                style: TextStyle(fontWeight: FontWeight.w900),
              ),
            ),
          ),
          const SizedBox(height: 10),
        ],
        SizedBox(
          width: double.infinity,
          child: OutlinedButton.icon(
            key: const Key('episode-one-greenhouse-interior-return'),
            onPressed: snapshot.inputLocked ? null : controller.returnToGarden,
            icon: const Icon(Icons.park_rounded),
            label: const Text('중앙 정원으로 돌아가기'),
          ),
        ),
''',
          )

          finale_test = Path('test/episode_one_finale_test.dart')
          text = finale_test.read_text(encoding='utf-8')
          marker = "    await tester.pump(const Duration(milliseconds: 300));\n"
          replacement = marker + "    await _startFinale(tester);\n"
          if text.count(marker) != 4:
              raise SystemExit(f'expected 4 finale test pump markers, found {text.count(marker)}')
          text = text.replace(marker, replacement)
          text = text.replace(
              "    await tester.tap(find.byKey(const Key('episode-one-hypothesis-0')));",
              "    await _tapVisible(tester, const Key('episode-one-hypothesis-0'));",
          )
          text = text.replace(
              "    await tester.tap(find.byKey(const Key('episode-one-hypothesis-1')));",
              "    await _tapVisible(tester, const Key('episode-one-hypothesis-1'));",
          )
          text = text.replace(
              "    await tester.tap(find.byKey(const Key('episode-one-deduction-action')));",
              "    await _tapVisible(tester, const Key('episode-one-deduction-action'));",
          )
          helper = '''
Future<void> _startFinale(WidgetTester tester) async {
  await _tapVisible(tester, const Key('episode-one-start-final-deduction'));
  await tester.pump();
}

Future<void> _tapVisible(WidgetTester tester, Key key) async {
  final finder = find.byKey(key);
  await tester.ensureVisible(finder);
  await tester.pump();
  await tester.tap(finder);
  await tester.pump();
}

'''
          insert_before = 'class _FakeProgressStore extends ProgressStore {'
          if insert_before not in text:
              raise SystemExit('fake store marker not found')
          text = text.replace(insert_before, helper + insert_before, 1)
          finale_test.write_text(text, encoding='utf-8')
          PY

          dart format \
            lib/features/adventure/escape/episode_one/episode_one_escape_screen.dart \
            lib/features/adventure/escape/episode_one/widgets/episode_one_greenhouse_overlay.dart \
            test/episode_one_finale_test.dart

      - name: Validate complete Episode 1
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /Rumi/ --pwa-strategy=none

      - name: Record successful validation
        shell: bash
        run: |
          cat > docs/EPISODE_01_FULL_VALIDATION.md <<'EOF'
          # Episode 1 전체 자동 검증 결과

          - 검증일: 2026-07-28
          - flutter pub get: 성공
          - dart format: 성공
          - flutter analyze: 성공
          - flutter test: 성공
          - flutter build web: 성공

          ## 최종 판정

          Episode 1 P0~P5, 최종 추리, 결말과 보상 저장 코드가 전체 자동 검증을 통과했다.

          ## 사용자 흐름 보완

          P5 성공 직후 최종 추리 화면이 발견 장면을 즉시 덮지 않도록 수정했다. 플레이어가 씨앗과 포포의 발견 결과를 확인하고 `세 증거를 연결해 사건 해결하기`를 선택한 뒤 최종 추리로 이동한다.
          EOF

          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/EPISODE_01_FINALE_STATUS.md')
          if status_path.exists():
              text = status_path.read_text(encoding='utf-8')
              text = text.replace(
                  '- 상태: 코드 구현 완료, Flutter 명령 검증 대기',
                  '- 상태: 코드 구현 및 전체 자동 검증 완료',
                  1,
              )
              status_path.write_text(text, encoding='utf-8')

          context_path = Path('PROJECT_CONTEXT.md')
          context = context_path.read_text(encoding='utf-8').rstrip()
          heading = '## 22. Episode 1 본편 구현 및 자동 검증 완료 (2026-07-28)'
          if heading not in context:
              context += '''

## 22. Episode 1 본편 구현 및 자동 검증 완료 (2026-07-28)

### 구현 완료 범위

- P0~P5 전체 퍼즐과 장면 흐름
- 핵심 증거 3개를 연결하는 최종 추리
- 포포가 씨앗을 보호했다는 결말
- 씨앗 귀환과 별빛 꽃 개화 연출
- `ProgressStore.completeAdventure(earnedExperience: 110)`을 통한 경험치와 완료 횟수 저장
- 저장 실패 재시도와 Home 화면 복귀
- P5 발견 결과 확인 후 버튼을 눌러 최종 추리로 이동하는 명시적 전환

### 자동 검증

다음 항목을 모두 통과했다.

- `flutter pub get`
- `dart format`
- `flutter analyze`
- `flutter test`
- `flutter build web --release --base-href /Rumi/ --pwa-strategy=none`

상세 결과는 `docs/EPISODE_01_FULL_VALIDATION.md`에 기록했다.

### 남은 확인

1. Galaxy 태블릿에서 Episode 1 처음부터 끝까지 실제 플레이
2. 터치 영역, SafeArea, 스크롤과 화면 겹침 확인
3. 애니메이션 속도와 건너뛰기 동작 확인
4. 경험치 +110, 완료 횟수와 꽃숲 성장 반영 확인
5. 초등학교 5학년 대상 10분 사용자 테스트
6. 사용자 피드백에 따른 난이도·힌트·문구 조정

### 다음 개발 단계

신규 기능을 추가하기 전에 실기기 전체 플레이와 사용자 테스트를 진행한다.
'''
              context_path.write_text(context + '\n', encoding='utf-8')
          PY

      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-episode-one-final-validation.yml
          rm -f .github/workflows/validate-episode-one-complete.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: verify complete episode one finale flow'
          git push origin HEAD:main
