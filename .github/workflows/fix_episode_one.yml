name: Fix Episode One Flow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix_episode_one.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch episode one flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/adventure/flame/episode_1_flame_screen.dart')
          s = p.read_text()
          s = s.replace("_transition = math.max(0, _transition - dt * 2.8);", "_transition = math.max(0, _transition - dt * 2.8).toDouble();")
          s = s.replace("Color.fromRGBO(255, 220, 105, spark.life.clamp(0, 1))", "Color.fromRGBO(255, 220, 105, spark.life.clamp(0, 1).toDouble())")
          old = "  void _handlePedestalTap(Offset point) {\n    final targets = <_PedestalClue, Offset>{"
          new = "  void _handlePedestalTap(Offset point) {\n    if (_dust.every((item) => item.group != null) && _primaryButton.contains(point)) {\n      _changeScene(_EpisodeScene.trail, '4칸마다 발자국, 6칸마다 별가루가 나타납니다.');\n      return;\n    }\n\n    final targets = <_PedestalClue, Offset>{"
          s = s.replace(old, new)
          old = "    if (_hasKey && !_keyDragging && _keyPosition.distanceTo(Vector2(point.dx, point.dy)) < 42) {\n      _keyDragging = true;\n    }\n\n    if (_factors.length == 6 && _primaryButton.contains(point)) {"
          new = "    final lockCenter = Vector2(size.x * 0.62, size.y * 0.47);\n    if (_hasKey && _keyPosition.distanceTo(lockCenter) < 12) {\n      final values = [1, 2, 3, 4, 5, 6, 8, 12];\n      for (var index = 0; index < values.length; index++) {\n        final factorPoint = Offset(\n          size.x * (0.18 + (index % 4) * 0.21),\n          size.y * (0.72 + (index ~/ 4) * 0.08),\n        );\n        if ((point - factorPoint).distance < 32) {\n          _toggleFactor(values[index]);\n          return;\n        }\n      }\n    }\n\n    if (_hasKey && !_keyDragging && _keyPosition.distanceTo(Vector2(point.dx, point.dy)) < 42) {\n      _keyDragging = true;\n    }\n\n    if (_factorsSolved && _primaryButton.contains(point)) {"
          s = s.replace(old, new)
          s = s.replace("  int _countInGroup(int group) => _dust.where((piece) => piece.group == group).length;\n", "  int _countInGroup(int group) => _dust.where((piece) => piece.group == group).length;\n\n  bool get _factorsSolved {\n    const answer = {1, 2, 3, 4, 6, 12};\n    return _factors.length == answer.length && _factors.containsAll(answer);\n  }\n")
          s = s.replace("    if (_factors.length == 6) {\n        _drawButton(canvas, _primaryButton, '세 증거 연결해 추리');\n      }", "    if (_factorsSolved) {\n        _drawButton(canvas, _primaryButton, '세 증거 연결해 추리');\n      }")
          p.write_text(s)
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/fix_episode_one.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/adventure/flame/episode_1_flame_screen.dart .github/workflows/fix_episode_one.yml
          git commit -m "fix: complete Flame episode one interactions"
          git push
