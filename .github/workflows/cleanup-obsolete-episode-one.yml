name: Clean obsolete Episode 1 versions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-episode-one.yml'

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove obsolete versions and connect final Episode 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home_path = Path('lib/features/home/home_screen.dart')
          home = home_path.read_text(encoding='utf-8')
          home = home.replace(
              "import '../adventure/garden_exploration_screen.dart';\nimport '../adventure/starlight_seed_episode_screen.dart';",
              "import '../adventure/escape/episode_one/episode_one_escape_screen.dart';",
          )
          start = home.index('  Future<void> _startAdventure() async {')
          end = home.index('\n  @override', start)
          replacement = '''  Future<void> _startAdventure() async {
            await Navigator.of(context).push<void>(
              MaterialPageRoute<void>(
                builder: (_) => EpisodeOneEscapeScreen(store: widget.store),
              ),
            );
            await _loadProgress();
          }
          '''.replace('          ', '')
          home = home[:start] + replacement.rstrip() + '\n' + home[end:]
          home_path.write_text(home, encoding='utf-8')

          obsolete_sources = [
              'lib/features/adventure/garden_exploration_screen.dart',
              'lib/features/adventure/garden_mystery_v2_screen.dart',
              'lib/features/adventure/starlight_seed_episode_screen.dart',
              'lib/features/adventure/flame/episode_1_flame_screen.dart',
              'lib/features/adventure/flame/escape_feasibility_screen.dart',
          ]
          removed_sources = []
          for raw_path in obsolete_sources:
              path = Path(raw_path)
              if path.exists():
                  path.unlink()
                  removed_sources.append(raw_path)

          old_patterns = (
              'GardenExplorationScreen',
              'GardenMysteryV2Screen',
              'StarlightSeedEpisodeScreen',
              'EpisodeOneFlameScreen',
              'EscapeFeasibilityScreen',
              'garden_exploration_screen.dart',
              'garden_mystery_v2_screen.dart',
              'starlight_seed_episode_screen.dart',
              'episode_1_flame_screen.dart',
              'escape_feasibility_screen.dart',
              'open-development-preview-menu',
              'open-flame-episode-one',
              'open-flame-feasibility-lab',
          )
          removed_tests = []
          for path in sorted(Path('test').rglob('*.dart')):
              text = path.read_text(encoding='utf-8')
              if any(pattern in text for pattern in old_patterns):
                  removed_tests.append(path.as_posix())
                  path.unlink()

          math_question = Path('lib/features/adventure/math_question.dart')
          if math_question.exists():
              referenced = False
              for path in Path('lib').rglob('*.dart'):
                  if path == math_question:
                      continue
                  if 'math_question.dart' in path.read_text(encoding='utf-8'):
                      referenced = True
                      break
              if not referenced:
                  math_question.unlink()
                  removed_sources.append(math_question.as_posix())

          source_uses_audio = any(
              'package:flame_audio/' in path.read_text(encoding='utf-8')
              for root in (Path('lib'), Path('test'))
              if root.exists()
              for path in root.rglob('*.dart')
          )
          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text(encoding='utf-8')
          if not source_uses_audio:
              pubspec = pubspec.replace('  flame_audio: ^2.12.2\n', '')
              pubspec_path.write_text(pubspec, encoding='utf-8')

          Path('/tmp/removed_sources.txt').write_text(
              '\n'.join(removed_sources),
              encoding='utf-8',
          )
          Path('/tmp/removed_tests.txt').write_text(
              '\n'.join(removed_tests),
              encoding='utf-8',
          )

          test_path = Path('test/home_episode_one_navigation_test.dart')
          test_path.write_text('''import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'package:rumi/features/home/home_screen.dart';

          void main() {
            testWidgets('메인 화면에서 최종 Episode 1로 직접 이동한다', (tester) async {
              SharedPreferences.setMockInitialValues({
                'player_nickname': '루나',
              });

              await tester.pumpWidget(const MaterialApp(home: HomeScreen()));
              await tester.pumpAndSettle();

              expect(find.text('사건 조사하기'), findsOneWidget);
              await tester.tap(find.text('사건 조사하기'));
              await tester.pump();
              await tester.pump(const Duration(milliseconds: 500));

              expect(
                find.byKey(const Key('episode-one-foundation-back')),
                findsOneWidget,
              );
              expect(find.text('새 방탈출 Episode 1 전체 체험'), findsNothing);
              expect(tester.takeException(), isNull);

              await tester.pumpWidget(const SizedBox.shrink());
            });
          }
          '''.replace('          ', ''), encoding='utf-8')
          PY

          if grep -R -n -E 'GardenExplorationScreen|GardenMysteryV2Screen|StarlightSeedEpisodeScreen|EpisodeOneFlameScreen|EscapeFeasibilityScreen|garden_exploration_screen|garden_mystery_v2_screen|starlight_seed_episode_screen|episode_1_flame_screen|escape_feasibility_screen' lib test; then
            echo 'Obsolete Episode 1 reference remains.' >&2
            exit 1
          fi

      - name: Resolve dependencies and format changed files
        shell: bash
        run: |
          flutter pub get
          dart format \
            lib/features/home/home_screen.dart \
            test/home_episode_one_navigation_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/features/home/home_screen.dart \
            test/home_episode_one_navigation_test.dart

      - name: Run full validation
        shell: bash
        run: |
          flutter analyze
          flutter test
          flutter build web --release --base-href /Rumi/ --pwa-strategy=none

      - name: Record cleanup and validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          removed_sources = [
              line for line in Path('/tmp/removed_sources.txt').read_text(encoding='utf-8').splitlines()
              if line
          ]
          removed_tests = [
              line for line in Path('/tmp/removed_tests.txt').read_text(encoding='utf-8').splitlines()
              if line
          ]

          validation = [
              '# Episode 1 이전 버전 정리 및 자동 검증',
              '',
              '- 최종 Episode 1 단일 실행 경로 전환: 성공',
              '- 이전 실행 코드 제거: 성공',
              '- 이전 버전 전용 테스트 제거: 성공',
              '- `flutter pub get`: 성공',
              '- `dart format`: 성공',
              '- `flutter analyze`: 성공',
              '- `flutter test`: 성공',
              '- `flutter build web --release --base-href /Rumi/ --pwa-strategy=none`: 성공',
              '',
              '## 제거한 실행 코드',
              '',
          ]
          validation.extend(f'- `{path}`' for path in removed_sources)
          validation.extend(['', '## 제거한 이전 버전 전용 테스트', ''])
          if removed_tests:
              validation.extend(f'- `{path}`' for path in removed_tests)
          else:
              validation.append('- 별도 파일 없음')
          validation.extend([
              '',
              '## 유지한 항목',
              '',
              '- `lib/features/adventure/escape/episode_one/` 최종 Episode 1',
              '- 방탈출 분석·설계·검증 문서',
              '- 최종 Episode 1 자동 테스트',
              '- 경험치와 완료 횟수 저장 기능',
          ])
          Path('docs/EPISODE_01_LEGACY_CLEANUP_VALIDATION.md').write_text(
              '\n'.join(validation) + '\n',
              encoding='utf-8',
          )

          context_path = Path('PROJECT_CONTEXT.md')
          context = context_path.read_text(encoding='utf-8')
          heading = '## 22. Episode 1 단일 실행 버전 전환 및 구버전 정리 (2026-07-28)'
          if heading not in context:
              context = context.rstrip() + f'''

{heading}

### 실행 경로 변경

Home 화면의 `사건 조사하기` 버튼은 중간 개발 메뉴를 거치지 않고
`EpisodeOneEscapeScreen`을 직접 실행한다.

```text
Home
→ 사건 조사하기
→ 최종 Episode 1 「사라진 별빛 씨앗」
```

### 제거 범위

- 기존 정원 조사 화면과 퀴즈형 Episode 화면
- 초기 Flame Episode 프로토타입
- Flame 기술 검증용 실행 화면
- 위 화면만 대상으로 하는 이전 테스트
- 다른 소스에서 사용하지 않는 `math_question.dart`
- 실제 코드에서 사용하지 않게 된 `flame_audio` 의존성

분석 보고서, 디자인 바이블, Episode 1 상세 설계서와 자동 검증 문서는
향후 유지보수 근거이므로 보존한다.

### 자동 검증

구버전 정리 후 다음 검사를 모두 통과했다.

- `flutter pub get`
- `dart format`
- `flutter analyze`
- `flutter test`
- `flutter build web --release --base-href /Rumi/ --pwa-strategy=none`

상세 결과는 `docs/EPISODE_01_LEGACY_CLEANUP_VALIDATION.md`에 기록했다.

### 다음 작업

1. Galaxy 태블릿 사용자 테스트에서 확인된 시각 완성도 문제 정리
2. Episode 1 비주얼 디자인 시스템과 정식 아트 방향 확정
3. 배경·캐릭터·UI·애니메이션·오디오를 순서대로 개선
4. 시각 개선 뒤 전체 자동 검증과 실기기 재검증
'''
          context_path.write_text(context, encoding='utf-8')
          PY

      - name: Commit cleanup to main
        shell: bash
        run: |
          rm .github/workflows/cleanup-obsolete-episode-one.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove obsolete episode one prototypes'
          git push origin HEAD:main
