name: Apply Flame feasibility prototype

on:
  push:
    paths:
      - '.github/workflows/apply-flame-feasibility.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create prototype files
        shell: bash
        run: |
          mkdir -p lib/features/adventure/flame test/features/adventure/flame
          echo '' | base64 -d | gzip -d > lib/features/adventure/flame/escape_feasibility_screen.dart
          echo '' | base64 -d | gzip -d > test/features/adventure/flame/escape_feasibility_screen_test.dart
      - name: Update dependency and entry point
        shell: python
        run: |
          from pathlib import Path
          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text()
          if '  flame_audio:' not in pubspec:
              marker = '  flame: ^1.38.0\n'
              if marker not in pubspec:
                  raise SystemExit('Flame dependency marker not found')
              pubspec_path.write_text(pubspec.replace(marker, marker + '  flame_audio: ^2.12.2\n'))

          path = Path('lib/features/adventure/garden_exploration_screen.dart')
          source = path.read_text()
          import_line = "import 'flame/escape_feasibility_screen.dart';\n"
          if import_line not in source:
              source = source.replace(
                  "import 'package:flutter/material.dart';\n\n",
                  "import 'package:flutter/material.dart';\n\n" + import_line,
              )
          button = """        Positioned(
                    left: 16,
                    bottom: 86,
                    child: SafeArea(
                      child: FilledButton.icon(
                        key: const Key('open-flame-feasibility-lab'),
                        style: FilledButton.styleFrom(
                          backgroundColor: const Color(0xFF78DFC3),
                          foregroundColor: const Color(0xFF17332D),
                          padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 14),
                          elevation: 10,
                        ),
                        onPressed: () {
                          Navigator.of(context).push(
                            MaterialPageRoute<void>(
                              builder: (_) => const EscapeFeasibilityScreen(),
                            ),
                          );
                        },
                        icon: const Icon(Icons.science_rounded),
                        label: const Text(
                          '방탈출 기술 검증',
                          style: TextStyle(fontWeight: FontWeight.w900),
                        ),
                      ),
                    ),
                  ),
          """
          marker = "        Positioned(\n          left: 16,\n          bottom: 18,"
          if 'open-flame-feasibility-lab' not in source:
              if marker not in source:
                  raise SystemExit('Prototype button marker not found')
              source = source.replace(marker, button + marker)
          path.write_text(source)
      - run: flutter pub get
      - run: dart format lib/features/adventure/flame/escape_feasibility_screen.dart lib/features/adventure/garden_exploration_screen.dart test/features/adventure/flame/escape_feasibility_screen_test.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /Rumi/
      - name: Commit verified prototype
        shell: bash
        run: |
          rm .github/workflows/apply-flame-feasibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate Flame escape room interactions'
          git push origin HEAD:main
