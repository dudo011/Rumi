name: Fix V2 Braces

on:
  push:
    paths:
      - '.github/workflows/fix-v2-braces.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply brace fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/adventure/garden_mystery_v2_screen.dart')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "for (var i = 0; i < 4; i++) canvas.drawLine(Offset(size.width * .5 + i * 5, size.height * .39), Offset(size.width * .6 + i * 5, size.height * .43), paint);": "for (var i = 0; i < 4; i++) {\n        canvas.drawLine(Offset(size.width * .5 + i * 5, size.height * .39), Offset(size.width * .6 + i * 5, size.height * .43), paint);\n      }",
              "for (var i = 0; i < 5; i++) canvas.drawCircle(Offset(size.width * (.58 + i * .045), size.height * (.5 + i * .045)), 7, Paint()..color = const Color(0xFFEAB4DB));": "for (var i = 0; i < 5; i++) {\n        canvas.drawCircle(Offset(size.width * (.58 + i * .045), size.height * (.5 + i * .045)), 7, Paint()..color = const Color(0xFFEAB4DB));\n      }",
              "for (var i = 0; i < 4; i++) canvas.drawLine(center + Offset(42, -18 + i * 12), center + Offset(size.width * (flowing ? .4 : .24), -10 + i * 12), scratchPaint);": "for (var i = 0; i < 4; i++) {\n      canvas.drawLine(center + Offset(42, -18 + i * 12), center + Offset(size.width * (flowing ? .4 : .24), -10 + i * 12), scratchPaint);\n    }",
              "for (var i = 0; i < 14; i++) canvas.drawCircle(Offset(center.dx + 40 + i * 18, center.dy - 42 + (i % 3) * 18), 5 + (i % 2) * 2, Paint()..color = const Color(0xFFFFE170));": "for (var i = 0; i < 14; i++) {\n        canvas.drawCircle(Offset(center.dx + 40 + i * 18, center.dy - 42 + (i % 3) * 18), 5 + (i % 2) * 2, Paint()..color = const Color(0xFFFFE170));\n      }",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-v2-braces.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/adventure/garden_mystery_v2_screen.dart .github/workflows/fix-v2-braces.yml
          git commit -m "fix: add braces to painter loops"
          git push
