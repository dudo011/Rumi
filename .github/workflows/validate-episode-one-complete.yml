name: Validate complete Episode 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and validate
        shell: bash
        run: |
          set +e

          flutter pub get > /tmp/pub-get.log 2>&1
          PUB_RESULT=$?

          dart format \
            lib/features/adventure/escape/episode_one \
            lib/features/adventure/garden_exploration_screen.dart \
            test/episode_one_escape_foundation_test.dart \
            test/episode_one_fountain_test.dart \
            test/episode_one_greenhouse_test.dart \
            test/episode_one_finale_test.dart \
            > /tmp/format.log 2>&1
          FORMAT_RESULT=$?

          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_RESULT=$?

          flutter test > /tmp/test.log 2>&1
          TEST_RESULT=$?

          flutter build web --release --base-href /Rumi/ --pwa-strategy=none \
            > /tmp/build.log 2>&1
          BUILD_RESULT=$?

          status_text() {
            if [ "$1" -eq 0 ]; then
              echo "성공"
            else
              echo "실패"
            fi
          }

          ALL_SUCCESS=0
          if [ "$PUB_RESULT" -eq 0 ] && \
             [ "$FORMAT_RESULT" -eq 0 ] && \
             [ "$ANALYZE_RESULT" -eq 0 ] && \
             [ "$TEST_RESULT" -eq 0 ] && \
             [ "$BUILD_RESULT" -eq 0 ]; then
            ALL_SUCCESS=1
          fi

          mkdir -p docs
          {
            echo "# Episode 1 전체 자동 검증 결과"
            echo
            echo "- 검증일: $(date -u +%Y-%m-%d)"
            echo "- 검증 기준 커밋: $(git rev-parse HEAD)"
            echo "- flutter pub get: $(status_text "$PUB_RESULT")"
            echo "- dart format: $(status_text "$FORMAT_RESULT")"
            echo "- flutter analyze: $(status_text "$ANALYZE_RESULT")"
            echo "- flutter test: $(status_text "$TEST_RESULT")"
            echo "- flutter build web: $(status_text "$BUILD_RESULT")"
            echo
            if [ "$ALL_SUCCESS" -eq 1 ]; then
              echo "## 최종 판정"
              echo
              echo "Episode 1 P0~P5, 최종 추리, 결말과 보상 저장 코드가 전체 자동 검증을 통과했다."
            else
              echo "## 최종 판정"
              echo
              echo "실패 항목이 있어 수정과 재검증이 필요하다."
              echo
            fi
            if [ "$PUB_RESULT" -ne 0 ]; then
              echo "## pub get 오류"
              echo '```text'
              tail -n 100 /tmp/pub-get.log
              echo '```'
              echo
            fi
            if [ "$FORMAT_RESULT" -ne 0 ]; then
              echo "## format 오류"
              echo '```text'
              tail -n 100 /tmp/format.log
              echo '```'
              echo
            fi
            if [ "$ANALYZE_RESULT" -ne 0 ]; then
              echo "## analyze 오류"
              echo '```text'
              tail -n 140 /tmp/analyze.log
              echo '```'
              echo
            fi
            if [ "$TEST_RESULT" -ne 0 ]; then
              echo "## test 오류"
              echo '```text'
              tail -n 180 /tmp/test.log
              echo '```'
              echo
            fi
            if [ "$BUILD_RESULT" -ne 0 ]; then
              echo "## build 오류"
              echo '```text'
              tail -n 120 /tmp/build.log
              echo '```'
            fi
          } > docs/EPISODE_01_FULL_VALIDATION.md

          echo "$ALL_SUCCESS" > /tmp/all-success

      - name: Commit validation result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/validate-episode-one-complete.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate complete episode one implementation'
          git push origin HEAD:main

      - name: Fail workflow when validation failed
        shell: bash
        run: |
          if [ "$(cat /tmp/all-success)" != "1" ]; then
            exit 1
          fi
