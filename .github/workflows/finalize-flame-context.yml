name: Finalize Flame project context

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'chore/finalize-flame-context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python tool/append_flame_context.py
      - name: Commit project context update
        shell: bash
        run: |
          rm tool/append_flame_context.py
          rm .github/workflows/finalize-flame-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: update project context for escape room direction'
          git push origin HEAD:main
