name: Diagnose Episode 1 pond

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-episode-one-pond.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run checks without stopping result collection
        shell: bash
        run: |
          set +e
          dart format --output=none --set-exit-if-changed \
            lib/features/adventure/escape/episode_one/episode_one_puzzles.dart \
            lib/features/adventure/escape/episode_one/episode_one_state.dart \
            lib/features/adventure/escape/episode_one/episode_one_scene.dart \
            lib/features/adventure/escape/episode_one/episode_one_escape_screen.dart \
            lib/features/adventure/escape/episode_one/widgets/episode_one_inventory_overlay.dart \
            lib/features/adventure/garden_exploration_screen.dart \
            test/episode_one_escape_foundation_test.dart > /tmp/format.log 2>&1
          FORMAT_RESULT=$?
          flutter pub get > /tmp/pub.log 2>&1
          PUB_RESULT=$?
          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_RESULT=$?
          flutter test > /tmp/test.log 2>&1
          TEST_RESULT=$?
          flutter build web --release --base-href /Rumi/ --pwa-strategy=none > /tmp/build.log 2>&1
          BUILD_RESULT=$?

          status_text() {
            if [ "$1" -eq 0 ]; then echo '성공'; else echo '실패'; fi
          }

          {
            echo '# Episode 1 구현 3단계 자동 검증 결과'
            echo
            echo "- 검증 기준 커밋: $(git rev-parse HEAD)"
            echo "- dart format: $(status_text "$FORMAT_RESULT")"
            echo "- flutter pub get: $(status_text "$PUB_RESULT")"
            echo "- flutter analyze: $(status_text "$ANALYZE_RESULT")"
            echo "- flutter test: $(status_text "$TEST_RESULT")"
            echo "- flutter build web: $(status_text "$BUILD_RESULT")"
            for item in format analyze test build; do
              result_var=$(echo "$item" | tr '[:lower:]' '[:upper:]')_RESULT
              eval result=\$$result_var
              if [ "$result" -ne 0 ]; then
                echo
                echo "## ${item} 오류"
                echo '```text'
                tail -n 160 "/tmp/${item}.log"
                echo '```'
              fi
            done
          } > docs/EPISODE_01_POND_VALIDATION.md
      - name: Commit diagnostic result
        shell: bash
        run: |
          rm .github/workflows/diagnose-episode-one-pond.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record episode one pond validation'
          git push origin HEAD:main
