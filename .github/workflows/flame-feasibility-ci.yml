name: Flame feasibility checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'chore/flame-feasibility-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python tool/apply_flame_feasibility_fix.py
      - run: flutter pub get
      - run: dart format lib/features/adventure/flame/escape_feasibility_screen.dart test/features/adventure/flame/escape_feasibility_screen_test.dart lib/features/adventure/garden_exploration_screen.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /Rumi/
      - name: Commit verified changes
        shell: bash
        run: |
          rm tool/apply_flame_feasibility_fix.py
          rm .github/workflows/flame-feasibility-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: verify Flame escape room feasibility prototype'
          git push origin HEAD:main
