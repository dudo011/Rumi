name: Flame feasibility checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > analyzer.log 2>&1
      - name: Upload analyzer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-log
          path: analyzer.log
      - name: Stop on analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: exit 1
      - run: flutter test
      - run: flutter build web --release --base-href /Rumi/
