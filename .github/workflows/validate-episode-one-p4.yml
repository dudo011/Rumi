name: Validate Episode 1 P4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-episode-one-p4.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run validation
        shell: bash
        run: |
          set +e
          flutter pub get > /tmp/pub-get.log 2>&1
          PUB_RESULT=$?
          dart format --output=none --set-exit-if-changed \
            lib/features/adventure/escape/episode_one \
            lib/features/adventure/garden_exploration_screen.dart \
            test/episode_one_escape_foundation_test.dart \
            test/episode_one_fountain_test.dart > /tmp/format.log 2>&1
          FORMAT_RESULT=$?
          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_RESULT=$?
          flutter test > /tmp/test.log 2>&1
          TEST_RESULT=$?
          flutter build web --release --base-href /Rumi/ --pwa-strategy=none > /tmp/build.log 2>&1
          BUILD_RESULT=$?

          status_text() {
            if [ "$1" -eq 0 ]; then
              echo "성공"
            else
              echo "실패"
            fi
          }

          mkdir -p docs
          {
            echo "# Episode 1 P4 자동 검증 결과"
            echo
            echo "- 검증 기준 커밋: $(git rev-parse HEAD)"
            echo "- flutter pub get: $(status_text "$PUB_RESULT")"
            echo "- dart format: $(status_text "$FORMAT_RESULT")"
            echo "- flutter analyze: $(status_text "$ANALYZE_RESULT")"
            echo "- flutter test: $(status_text "$TEST_RESULT")"
            echo "- flutter build web: $(status_text "$BUILD_RESULT")"
            for entry in \
              "Format:$FORMAT_RESULT:/tmp/format.log:100" \
              "Analyze:$ANALYZE_RESULT:/tmp/analyze.log:120" \
              "Test:$TEST_RESULT:/tmp/test.log:160" \
              "Build:$BUILD_RESULT:/tmp/build.log:100"; do
              IFS=: read -r title result log lines <<< "$entry"
              if [ "$result" -ne 0 ]; then
                echo
                echo "## $title 오류"
                echo '```text'
                tail -n "$lines" "$log"
                echo '```'
              fi
            done
          } > docs/EPISODE_01_P4_VALIDATION.md

      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/validate-episode-one-p4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/EPISODE_01_P4_VALIDATION.md .github/workflows/validate-episode-one-p4.yml
          git commit -m 'test: record episode one P4 validation'
          git push origin HEAD:main
