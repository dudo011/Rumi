name: Validate final Episode 1 runtime cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib
          test

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web app
        run: >-
          flutter build web
          --release
          --base-href /Rumi/
          --pwa-strategy=none
