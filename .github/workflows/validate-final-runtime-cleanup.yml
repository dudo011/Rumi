name: Validate final Episode 1 runtime cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate
        shell: bash
        run: |
          set +e

          flutter pub get > /tmp/pub-get.log 2>&1
          PUB_RESULT=$?
          dart format lib test > /tmp/format.log 2>&1
          FORMAT_RESULT=$?
          flutter analyze > /tmp/analyze.log 2>&1
          ANALYZE_RESULT=$?
          flutter test > /tmp/test.log 2>&1
          TEST_RESULT=$?
          flutter build web --release --base-href /Rumi/ --pwa-strategy=none > /tmp/build.log 2>&1
          BUILD_RESULT=$?

          status_text() {
            if [ "$1" -eq 0 ]; then echo "성공"; else echo "실패"; fi
          }

          ALL_SUCCESS=0
          if [ "$PUB_RESULT" -eq 0 ] && [ "$FORMAT_RESULT" -eq 0 ] && [ "$ANALYZE_RESULT" -eq 0 ] && [ "$TEST_RESULT" -eq 0 ] && [ "$BUILD_RESULT" -eq 0 ]; then
            ALL_SUCCESS=1
          fi

          {
            echo "# 최종 Episode 1 단일 실행 버전 검증 결과"
            echo
            echo "- 검증일: $(date -u +%Y-%m-%d)"
            echo "- 검증 기준 커밋: $(git rev-parse HEAD)"
            echo "- flutter pub get: $(status_text "$PUB_RESULT")"
            echo "- dart format: $(status_text "$FORMAT_RESULT")"
            echo "- flutter analyze: $(status_text "$ANALYZE_RESULT")"
            echo "- flutter test: $(status_text "$TEST_RESULT")"
            echo "- flutter build web: $(status_text "$BUILD_RESULT")"
            echo
            if [ "$ALL_SUCCESS" -eq 1 ]; then
              echo "## 최종 판정"
              echo
              echo "구버전 실행 코드와 전용 테스트를 제거한 뒤 최종 Episode 1 단일 실행 구조가 전체 자동 검증을 통과했다."
            else
              echo "## 최종 판정"
              echo
              echo "실패 항목이 있어 추가 수정과 재검증이 필요하다."
              echo
              if [ "$ANALYZE_RESULT" -ne 0 ]; then
                echo "## Analyze 오류"
                echo '```text'
                tail -n 160 /tmp/analyze.log
                echo '```'
              fi
              if [ "$TEST_RESULT" -ne 0 ]; then
                echo "## Test 오류"
                echo '```text'
                tail -n 220 /tmp/test.log
                echo '```'
              fi
            fi
          } > docs/FINAL_RUNTIME_CLEANUP_VALIDATION.md

          echo "$ALL_SUCCESS" > /tmp/all-success

      - name: Commit validation result
        shell: bash
        run: |
          rm .github/workflows/validate-final-runtime-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: confirm final episode one runtime cleanup'
          git push origin HEAD:main

      - name: Fail when validation failed
        shell: bash
        run: |
          if [ "$(cat /tmp/all-success)" != "1" ]; then exit 1; fi
