name: Update runtime cleanup context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-runtime-cleanup-context.yml'

permissions:
  contents: write

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update project context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('PROJECT_CONTEXT.md')
          text = path.read_text(encoding='utf-8')

          old = '''### 확인 상태

- 최종 Episode 1 직접 진입 테스트를 추가했다.
- 삭제한 파일의 import를 Home에서 제거했다.
- 임시 정리용 GitHub Actions 워크플로는 저장소에서 제거했다.
- 전체 Flutter 분석·테스트·Web 빌드는 GitHub Actions 또는 Codespaces에서 최종 재확인이 필요하다.

### 다음 작업

1. GitHub Actions의 전체 분석·테스트·Web 빌드 결과 확인
2. Galaxy 태블릿에서 최종 Episode 1 단일 진입 흐름 재확인
3. Episode 1 비주얼 디자인 시스템과 정식 아트 방향 확정
4. 배경·캐릭터·UI·애니메이션·오디오 개선
'''

          new = '''### 최종 검증 완료

- 최종 Episode 1 직접 진입 테스트를 추가했다.
- 삭제한 파일의 import를 Home에서 제거했다.
- 남아 있던 구버전 전용 `garden_exploration_screen_test.dart`도 제거했다.
- 임시 검증용 Pull Request와 GitHub Actions 워크플로를 모두 정리했다.
- `docs/FINAL_RUNTIME_CLEANUP_VALIDATION.md`에 최종 결과를 기록했다.

다음 항목을 모두 통과했다.

- `flutter pub get`
- `dart format`
- `flutter analyze`
- `flutter test`
- `flutter build web --release --base-href /Rumi/ --pwa-strategy=none`

### 다음 작업

1. Galaxy 태블릿에서 최종 Episode 1 단일 진입 흐름 재확인
2. Episode 1 비주얼 디자인 시스템과 정식 아트 방향 확정
3. 배경·캐릭터·UI·애니메이션·오디오 개선
4. 초등학교 5학년 대상 사용자 플레이 테스트
'''

          if old not in text:
              raise SystemExit('Expected runtime cleanup context block was not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit context update
        shell: bash
        run: |
          rm .github/workflows/update-runtime-cleanup-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize runtime cleanup validation status'
          git push origin HEAD:main
